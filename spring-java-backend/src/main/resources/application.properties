# Spring Servlet
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
springdoc.api-docs.path=/api-docs

# Spring Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Spring JDBC
spring.datasource.url=${JDBC_DATASOURCE_URL}
spring.datasource.username=${JDBC_DATASOURCE_USERNAME}
spring.datasource.password=${JDBC_DATASOURCE_PASSWORD}
spring.datasource.schema=public

## Spring Hikari DataSource config
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=5

# Spring JPA
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.location=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-4-vision
